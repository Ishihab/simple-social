{% extends "base.html" %}

{% block title %}Log In{% endblock %}
{% set login_page = True %}
{% block content %}


<section class="flex min-h-screen items-center justify-center bg-base-100 relative">
  <div class="card w-full max-w-lg shrink-0 bg-base-100 shadow-2xl">
    <div class="card-body">
      <h2 class="card-title text-2xl justify-center mb-2">Welcome back</h2>

      <div id="login-error" class="hidden">
        <div class="alert alert-error text-sm py-2">
          <span>Invalid email or password.</span>
        </div>
      </div>
      <form         id="login-form"
        hx-post="/auth/cookie/login"
        hx-on::after-request="
          if (event.detail.successful) {
            window.location.href='/feed';
          } else {
            document.getElementById('login-error').classList.remove('hidden');
          }
        " class="flex flex-col">
        <label class="label">Email</label>
        <input class="input w-full" type="email" name="username" placeholder="email" required />
        <label class="label">Password</label>
        <input class="input w-full" type="password" name="password" placeholder="password" required />
        <button type="submit" class="b btn mt-4 uppercase btn-primary">submit</button>
      </form>
      <a class="link link-hover">Forgot password?</a>
      <p>Don’t Have An Account? <a href="/auth/register" class="link"> Sign Up</a></p>
    </div>
  </div>
</section>
{% endblock %}
